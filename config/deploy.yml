# Kamal config for Single Server.
# Notes:
# - deploy_timeout 120: first boot runs cache-clear + migrate + optimize.
# - No `init: true`: serversideup images use s6-overlay, which must be PID 1.
# - storage/app/public is symlinked to /storage/app-public in the image:
#   uploaded attachments survive deploys on the persistent volume.
service: talk
image: talk
servers:
  web:
    hosts:
      - 127.0.0.1
    options:
      stop-timeout: 30
      memory: 1g
ssh:
  user: deploy
  keys:
    - /root/.ssh/id_ed25519
registry:
  server: 127.0.0.1:5555
  username: dummy
  password: dummy
builder:
  arch: amd64
  args:
    VITE_PUSHER_APP_KEY: "fde0cfed09986b45e842"
    VITE_PUSHER_CLUSTER: "eu"
  local: true
  driver: docker
  context: .
proxy:
  host: talk.antihq.com
  app_port: 8080
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
    interval: 15
    timeout: 1
  run:
    bind_ips:
      - 127.0.0.1
env:
  secret:
    - APP_DEBUG
    - APP_ENV
    - APP_KEY
    - APP_URL
    - DB_DATABASE
    - LOG_CHANNEL
    - QUEUE_CONNECTION
    - APP_NAME
    - APP_LOCALE
    - APP_FALLBACK_LOCALE
    - APP_FAKER_LOCALE
    - APP_MAINTENANCE_DRIVER
    - BCRYPT_ROUNDS
    - LOG_STACK
    - LOG_DEPRECATIONS_CHANNEL
    - LOG_LEVEL
    - DB_CONNECTION
    - SESSION_DRIVER
    - SESSION_LIFETIME
    - SESSION_ENCRYPT
    - SESSION_PATH
    - SESSION_DOMAIN
    - BROADCAST_CONNECTION
    - PUSHER_APP_ID
    - PUSHER_APP_KEY
    - PUSHER_APP_SECRET
    - PUSHER_HOST
    - PUSHER_PORT
    - PUSHER_SCHEME
    - FILESYSTEM_DISK
    - CACHE_STORE
    - MEMCACHED_HOST
    - REDIS_CLIENT
    - REDIS_HOST
    - REDIS_PASSWORD
    - REDIS_PORT
    - MAIL_MAILER
    - MAIL_SCHEME
    - MAIL_HOST
    - MAIL_PORT
    - MAIL_ENCRYPTION
    - MAIL_USERNAME
    - MAIL_PASSWORD
    - MAIL_FROM_ADDRESS
    - MAIL_FROM_NAME
    - AWS_DEFAULT_REGION
    - AWS_USE_PATH_STYLE_ENDPOINT
    - VITE_APP_NAME
    - VAPID_SUBJECT
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
volumes:
  - /srv/storage/talk:/storage
deploy_timeout: 120
drain_timeout: 5
